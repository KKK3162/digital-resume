<h2>Tüm Kitap Ödünç Talepleri</h2>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Kullanıcı</th>
            <th>Kitap</th>
            <th>Durum</th>
            <th>İstek Tarihi</th>
        </tr>
    </thead>
    <tbody>
        {% for req in all_requests %}
        <tr>
            <td>{{ req.id }}</td>
            <td>{{ req.user_id }}</td>
            <td>{{ req.book_id }}</td>
            <td>{{ req.status }}</td>
            <td>{{ req.requested_at.strftime('%d.%m.%Y %H:%M') }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
